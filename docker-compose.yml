# The images are downloaded from the GitHub Container Registry, where CI publishes them
# (.github/workflows/images.yml). If they cannot be downloaded, they are built from this folder.
services:
    django:
        image: ${DATAGATHERER_IMAGES:-ghcr.io/videm02}/datagatherer-backend:${DATAGATHERER_VERSION:-latest}
        build: ./backend/data_gatherer
        container_name: data-gatherer-server
        # gthread workers keep answering heartbeats while long requests (matrix export, OCR) run
        command: gunicorn data_gatherer.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 4 --timeout 120 --access-logfile -
        env_file:
            - .env.docker
        volumes:
            - prod_static:/srv/app/static
            - prod_media:/srv/app/media
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
    db:
        image: postgres:16.1-alpine
        container_name: prod-swang-db
        env_file:
            - .env.docker
        volumes:
            - prod_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped
    nginx:
        image: ${DATAGATHERER_IMAGES:-ghcr.io/videm02}/datagatherer-nginx:${DATAGATHERER_VERSION:-latest}
        # Built from the repository root: the image also builds the React app, so no Node.js is needed
        build:
            context: .
            dockerfile: nginx/Dockerfile
        container_name: prod-nginx
        ports:
            # Only reachable from this computer. APP_PORT is chosen by start.sh / start.ps1
            - 127.0.0.1:${APP_PORT:-8080}:80
        restart: unless-stopped
        volumes:
            - prod_static:/srv/app/static
            - prod_media:/srv/app/media
        depends_on:
            - django

volumes:
    prod_postgres_data:
    prod_media:
    prod_static:
