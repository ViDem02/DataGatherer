<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">DataGatherer</title>
  <desc id="d">Screenshots of posts are cropped, read by OCR and turned into a user by hashtag matrix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.55" stop-color="#0b1b15"/>
      <stop offset="1" stop-color="#062a1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a30"/>
      <stop offset="1" stop-color="#0f2a20"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
    <clipPath id="cardClip"><rect x="0" y="0" width="210" height="270" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    @keyframes scan { 0% { transform: translateY(46px); } 50% { transform: translateY(250px); } 100% { transform: translateY(46px); } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes pop { 0%, 30% { opacity: 0.15; } 60%, 100% { opacity: 1; } }
    .scanner { animation: scan 4s ease-in-out infinite; }
    .crop { animation: dash 1.2s linear infinite; }
    .flow { animation: dash 0.9s linear infinite; }
    .blink { animation: pulse 2.4s ease-in-out infinite; }
    .c1 { animation: pop 4s ease-in-out infinite; }
    .c2 { animation: pop 4s ease-in-out 0.4s infinite; }
    .c3 { animation: pop 4s ease-in-out 0.8s infinite; }
    .c4 { animation: pop 4s ease-in-out 1.2s infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <circle cx="1210" cy="-40" r="180" fill="#10b981" fill-opacity="0.07"/>

    <!-- Left: wordmark -->
    <g transform="translate(72,0)">
      <g transform="translate(0,96)">
        <rect width="168" height="30" rx="15" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4.5" fill="#34d399" class="blink"/>
        <text x="32" y="20" font-size="13" font-weight="600" fill="#a7f3d0" letter-spacing="0.6">IMAGE → DATA</text>
      </g>
      <text x="-3" y="194" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2.5">DataGatherer</text>
      <text x="0" y="242" font-size="25" font-weight="500" fill="#d1fae5">Screenshots in. Structured data out.</text>
      <text x="0" y="276" font-size="17" fill="#8fb8a8">Crop once, let OCR read, confirm, and export a</text>
      <text x="0" y="300" font-size="17" fill="#8fb8a8">user × hashtag matrix ready for analysis.</text>

      <g transform="translate(0,334)" font-size="13" font-weight="600">
        <rect width="92" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="46" y="19" text-anchor="middle" fill="#d1fae5">Django 5.2</text>
        <rect x="102" width="84" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="144" y="19" text-anchor="middle" fill="#d1fae5">React 18</text>
        <rect x="196" width="110" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="251" y="19" text-anchor="middle" fill="#d1fae5">Tesseract OCR</text>
        <rect x="316" width="114" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="373" y="19" text-anchor="middle" fill="#d1fae5">PostgreSQL 16</text>
        <rect x="440" width="74" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="477" y="19" text-anchor="middle" fill="#d1fae5">Docker</text>
      </g>
    </g>

    <!-- Right: stacked screenshots -->
    <g transform="translate(700,74)">
      <g transform="rotate(-9 105 135) translate(-26,10)" opacity="0.35">
        <rect width="210" height="270" rx="16" fill="#12211b" stroke="#2a4a3d"/>
      </g>
      <g transform="rotate(-4.5 105 135) translate(-12,4)" opacity="0.6">
        <rect width="210" height="270" rx="16" fill="#132520" stroke="#2a4a3d"/>
        <rect x="14" y="52" width="182" height="120" rx="8" fill="url(#photo)"/>
      </g>

      <!-- front card -->
      <g>
        <rect width="210" height="270" rx="16" fill="#152a22" stroke="#2f5646" stroke-width="1.2"/>
        <g clip-path="url(#cardClip)">
          <circle cx="30" cy="26" r="11" fill="#34d399" fill-opacity="0.85"/>
          <rect x="50" y="20" width="84" height="11" rx="5.5" fill="#e5fff4" fill-opacity="0.85"/>
          <circle cx="188" cy="26" r="2" fill="#8fb8a8"/><circle cx="181" cy="26" r="2" fill="#8fb8a8"/><circle cx="195" cy="26" r="2" fill="#8fb8a8"/>
          <rect x="14" y="48" width="182" height="124" rx="8" fill="url(#photo)"/>
          <path d="M14 150 L66 108 L98 134 L136 96 L196 146 L196 164 Q196 172 188 172 L22 172 Q14 172 14 164 Z" fill="#10b981" fill-opacity="0.22"/>
          <circle cx="160" cy="76" r="12" fill="#a7f3d0" fill-opacity="0.35"/>
          <rect x="14" y="184" width="150" height="8" rx="4" fill="#8fb8a8" fill-opacity="0.55"/>
          <rect x="14" y="200" width="118" height="8" rx="4" fill="#8fb8a8" fill-opacity="0.4"/>
          <rect x="14" y="222" width="54" height="10" rx="5" fill="#34d399"/>
          <rect x="74" y="222" width="70" height="10" rx="5" fill="#34d399" fill-opacity="0.8"/>
          <rect x="150" y="222" width="44" height="10" rx="5" fill="#34d399" fill-opacity="0.65"/>
          <rect x="14" y="240" width="62" height="10" rx="5" fill="#34d399" fill-opacity="0.75"/>
          <rect x="82" y="240" width="48" height="10" rx="5" fill="#34d399" fill-opacity="0.6"/>

          <!-- scanner -->
          <g class="scanner">
            <rect x="0" y="-40" width="210" height="40" fill="url(#scanTrail)"/>
            <rect x="0" y="-1.5" width="210" height="3" fill="url(#scan)"/>
          </g>
        </g>

        <!-- crop boxes -->
        <rect x="42" y="13" width="100" height="26" rx="5" fill="none" stroke="#6ee7b7" stroke-width="1.6" stroke-dasharray="6 6" class="crop"/>
        <rect x="8" y="215" width="194" height="42" rx="6" fill="none" stroke="#6ee7b7" stroke-width="1.6" stroke-dasharray="6 6" class="crop"/>
        <g font-size="10.5" font-weight="700" letter-spacing="0.4">
          <rect x="146" y="-8" width="66" height="18" rx="5" fill="#34d399"/>
          <text x="179" y="5" text-anchor="middle" fill="#052e21">USERNAME</text>
          <rect x="128" y="258" width="66" height="18" rx="5" fill="#34d399"/>
          <text x="161" y="271" text-anchor="middle" fill="#052e21">HASHTAGS</text>
        </g>
      </g>
    </g>

    <!-- flow arrow -->
    <g transform="translate(930,210)">
      <path d="M0 0 H62" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 8" class="flow"/>
      <path d="M58 -7 L70 0 L58 7" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-2" y="-34" width="74" height="20" rx="6" fill="#0b1b15" stroke="#2f5646"/>
      <text x="35" y="-20" text-anchor="middle" font-size="11" font-weight="700" fill="#a7f3d0" class="mono">OCR</text>
    </g>

    <!-- matrix -->
    <g transform="translate(1022,116)">
      <rect x="-14" y="-14" width="222" height="214" rx="14" fill="#0b1b15" stroke="#2f5646"/>
      <g font-size="10" fill="#8fb8a8" class="mono">
        <text x="48" y="6">u1</text><text x="80" y="6">u2</text><text x="112" y="6">u3</text><text x="144" y="6">u4</text><text x="176" y="6">u5</text>
        <text x="0" y="34">#tag1</text><text x="0" y="66">#tag2</text><text x="0" y="98">#tag3</text><text x="0" y="130">#tag4</text><text x="0" y="162">#tag5</text>
      </g>
      <g transform="translate(42,14)">
        <!-- row 1 -->
        <rect class="c1" x="0"   y="0" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.95"/>
        <rect class="c2" x="32"  y="0" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.35"/>
        <rect class="c3" x="64"  y="0" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.12"/>
        <rect class="c4" x="96"  y="0" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.6"/>
        <rect class="c1" x="128" y="0" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.2"/>
        <!-- row 2 -->
        <rect class="c2" x="0"   y="32" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.25"/>
        <rect class="c3" x="32"  y="32" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.8"/>
        <rect class="c4" x="64"  y="32" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.5"/>
        <rect class="c1" x="96"  y="32" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.1"/>
        <rect class="c2" x="128" y="32" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.7"/>
        <!-- row 3 -->
        <rect class="c3" x="0"   y="64" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.55"/>
        <rect class="c4" x="32"  y="64" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.15"/>
        <rect class="c1" x="64"  y="64" width="28" height="28" rx="5" fill="#34d399" fill-opacity="1"/>
        <rect class="c2" x="96"  y="64" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.4"/>
        <rect class="c3" x="128" y="64" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.3"/>
        <!-- row 4 -->
        <rect class="c4" x="0"   y="96" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.1"/>
        <rect class="c1" x="32"  y="96" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.6"/>
        <rect class="c2" x="64"  y="96" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.25"/>
        <rect class="c3" x="96"  y="96" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.9"/>
        <rect class="c4" x="128" y="96" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.45"/>
        <!-- row 5 -->
        <rect class="c1" x="0"   y="128" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.7"/>
        <rect class="c2" x="32"  y="128" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.2"/>
        <rect class="c3" x="64"  y="128" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.35"/>
        <rect class="c4" x="96"  y="128" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.15"/>
        <rect class="c1" x="128" y="128" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.85"/>
      </g>
      <text x="97" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#a7f3d0" class="mono">matrix.csv</text>
    </g>
  </g>
</svg>
