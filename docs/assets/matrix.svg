<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Example output matrix</title>
  <desc id="d">Illustrative user by hashtag matrix: rows are hashtags, columns are accounts, each cell counts the posts by that account containing that hashtag. Sample data only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="1" stop-color="#0b1f18"/>
    </linearGradient>
    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .h { font-size: 13px; fill: #8fb8a8; }
    .v { font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- left copy -->
  <g transform="translate(64,0)">
    <text y="86" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1.2">THE OUTPUT</text>
    <text y="128" font-size="34" font-weight="800" fill="#ecfdf5" letter-spacing="-1">One matrix.</text>
    <text y="168" font-size="34" font-weight="800" fill="#ecfdf5" letter-spacing="-1">Every relationship.</text>
    <text y="214" font-size="16" fill="#8fb8a8">Rows are hashtags, columns are accounts.</text>
    <text y="238" font-size="16" fill="#8fb8a8">Each cell counts the posts by that account</text>
    <text y="262" font-size="16" fill="#8fb8a8">that use that hashtag.</text>
    <g transform="translate(0,300)">
      <rect width="300" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#2f5646"/>
      <text x="16" y="30" font-size="14" fill="#a7f3d0" class="mono">weight(user, tag) = #posts</text>
    </g>
    <text y="376" font-size="12" fill="#5f8a7a">Sample data for illustration.</text>
  </g>

  <!-- heatmap -->
  <g transform="translate(560,56)">
    <!-- column headers -->
    <g class="h mono" text-anchor="middle">
      <text x="225" y="14">user_a</text><text x="299" y="14">user_b</text><text x="373" y="14">user_c</text>
      <text x="447" y="14">user_d</text><text x="521" y="14">user_e</text><text x="595" y="14">user_f</text>
    </g>
    <!-- row headers -->
    <g class="h mono" text-anchor="end">
      <text x="176" y="56">#mechanicalkeyboard</text>
      <text x="176" y="106">#keycaps</text>
      <text x="176" y="156">#desksetup</text>
      <text x="176" y="206">#customkeyboard</text>
      <text x="176" y="256">#switches</text>
      <text x="176" y="306">#keebs</text>
    </g>

    <g transform="translate(192,30)">
      <!-- row 1 -->
      <rect x="0"   y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.94"/><text x="33" y="26" class="v" fill="#052e21">14</text>
      <rect x="74"  y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.45"/><text x="107" y="26" class="v" fill="#ecfdf5">6</text>
      <rect x="148" y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.08"/><text x="181" y="26" class="v" fill="#5f8a7a">0</text>
      <rect x="222" y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.69"/><text x="255" y="26" class="v" fill="#ecfdf5">10</text>
      <rect x="296" y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.2"/><text x="329" y="26" class="v" fill="#ecfdf5">2</text>
      <rect x="370" y="0" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.57"/><text x="403" y="26" class="v" fill="#ecfdf5">8</text>
      <!-- row 2 -->
      <rect x="0"   y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.33"/><text x="33" y="76" class="v" fill="#ecfdf5">4</text>
      <rect x="74"  y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.82"/><text x="107" y="76" class="v" fill="#052e21">12</text>
      <rect x="148" y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.45"/><text x="181" y="76" class="v" fill="#ecfdf5">6</text>
      <rect x="222" y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.08"/><text x="255" y="76" class="v" fill="#5f8a7a">0</text>
      <rect x="296" y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.63"/><text x="329" y="76" class="v" fill="#ecfdf5">9</text>
      <rect x="370" y="50" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.14"/><text x="403" y="76" class="v" fill="#ecfdf5">1</text>
      <!-- row 3 -->
      <rect x="0"   y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.63"/><text x="33" y="126" class="v" fill="#ecfdf5">9</text>
      <rect x="74"  y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.14"/><text x="107" y="126" class="v" fill="#ecfdf5">1</text>
      <rect x="148" y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="1.0"/><text x="181" y="126" class="v" fill="#052e21">15</text>
      <rect x="222" y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.39"/><text x="255" y="126" class="v" fill="#ecfdf5">5</text>
      <rect x="296" y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.2"/><text x="329" y="126" class="v" fill="#ecfdf5">2</text>
      <rect x="370" y="100" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.75"/><text x="403" y="126" class="v" fill="#052e21">11</text>
      <!-- row 4 -->
      <rect x="0"   y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.08"/><text x="33" y="176" class="v" fill="#5f8a7a">0</text>
      <rect x="74"  y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.57"/><text x="107" y="176" class="v" fill="#ecfdf5">8</text>
      <rect x="148" y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.26"/><text x="181" y="176" class="v" fill="#ecfdf5">3</text>
      <rect x="222" y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.88"/><text x="255" y="176" class="v" fill="#052e21">13</text>
      <rect x="296" y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.45"/><text x="329" y="176" class="v" fill="#ecfdf5">6</text>
      <rect x="370" y="150" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.08"/><text x="403" y="176" class="v" fill="#5f8a7a">0</text>
      <!-- row 5 -->
      <rect x="0"   y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.75"/><text x="33" y="226" class="v" fill="#052e21">11</text>
      <rect x="74"  y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.2"/><text x="107" y="226" class="v" fill="#ecfdf5">2</text>
      <rect x="148" y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.45"/><text x="181" y="226" class="v" fill="#ecfdf5">6</text>
      <rect x="222" y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.14"/><text x="255" y="226" class="v" fill="#ecfdf5">1</text>
      <rect x="296" y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.94"/><text x="329" y="226" class="v" fill="#052e21">14</text>
      <rect x="370" y="200" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.33"/><text x="403" y="226" class="v" fill="#ecfdf5">4</text>
      <!-- row 6 -->
      <rect x="0"   y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.51"/><text x="33" y="276" class="v" fill="#ecfdf5">7</text>
      <rect x="74"  y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.69"/><text x="107" y="276" class="v" fill="#ecfdf5">10</text>
      <rect x="148" y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.08"/><text x="181" y="276" class="v" fill="#5f8a7a">0</text>
      <rect x="222" y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.51"/><text x="255" y="276" class="v" fill="#ecfdf5">7</text>
      <rect x="296" y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.26"/><text x="329" y="276" class="v" fill="#ecfdf5">3</text>
      <rect x="370" y="250" width="66" height="42" rx="8" fill="#34d399" fill-opacity="0.82"/><text x="403" y="276" class="v" fill="#052e21">12</text>
    </g>

    <!-- legend -->
    <g transform="translate(192,338)">
      <text x="0" y="12" font-size="12" fill="#5f8a7a">0</text>
      <rect x="16" y="2" width="200" height="12" rx="6" fill="url(#legend)"/>
      <text x="224" y="12" font-size="12" fill="#5f8a7a">15 posts</text>
    </g>
