<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="t d">
  <title id="t">DataGatherer in numbers</title>
  <desc id="d">1,089 screenshots processed; about 2 seconds of automated work per image; roughly 93 percent less effort than manual transcription. Figures are estimates.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f18"/>
      <stop offset="1" stop-color="#08140f"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; }
  </style>

  <!-- card 1 -->
  <g transform="translate(0,0)">
    <rect width="413" height="190" rx="22" fill="url(#card)" stroke="#2f5646"/>
    <text x="32" y="48" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1.2">SCREENSHOTS PROCESSED</text>
    <text x="30" y="118" font-size="64" font-weight="800" fill="url(#num)" letter-spacing="-2">1,089</text>
    <text x="32" y="152" font-size="15" fill="#8fb8a8">posts turned into structured rows</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(433,0)">
    <rect width="413" height="190" rx="22" fill="url(#card)" stroke="#2f5646"/>
    <text x="32" y="48" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1.2">TIME PER IMAGE</text>
    <text x="30" y="118" font-size="64" font-weight="800" fill="url(#num)" letter-spacing="-2">2 s</text>
    <text x="130" y="118" font-size="22" font-weight="600" fill="#5f8a7a">vs 30 s by hand</text>
    <rect x="32" y="140" width="350" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="32" y="140" width="23" height="8" rx="4" fill="#34d399" class="bar"/>
    <text x="32" y="172" font-size="13" fill="#5f8a7a">automated crop + OCR</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(866,0)">
    <rect width="414" height="190" rx="22" fill="url(#card)" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="32" y="48" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1.2">LESS MANUAL EFFORT</text>
    <text x="30" y="118" font-size="64" font-weight="800" fill="url(#num)" letter-spacing="-2">≈93%</text>
    <rect x="32" y="140" width="350" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="32" y="140" width="326" height="8" rx="4" fill="#34d399" class="bar"/>
    <text x="32" y="172" font-size="13" fill="#5f8a7a">estimate, excludes human verification</text>
  </g>
</svg>
