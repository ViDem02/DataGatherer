server {
  listen 80;
  server_tokens off;
  # Screenshots are uploaded in large batches, but the request size must stay bounded
  client_max_body_size 1g;
  fastcgi_read_timeout 1d;
  proxy_read_timeout 1d;

  # Serve static files from shared volume
  location ^~ /api/static/ {
    alias /srv/app/static/;
  }

  # Uploaded files are never public: Django checks who is asking, then hands the
  # file over to this internal location with X-Accel-Redirect.
  # Uploaded files must never be able to run as a page on this origin.
  location ^~ /protected_media/ {
    internal;
    alias /srv/app/media/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
  }

  # Redirect Django admin or api or websockets
  location ~ ^/(api) {
    proxy_pass http://django:8000;
    proxy_redirect default;
    include /etc/nginx/app/include.websocket;
    include /etc/nginx/app/include.forwarded;
  }

  # Any other request gets the React app (static files, client-side routing)
  location / {
    root /srv/frontend;
    try_files $uri /index.html;
    # Only this origin's code (plus the pinned Bootstrap CDN files) may run, and only this origin may be called
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

}
